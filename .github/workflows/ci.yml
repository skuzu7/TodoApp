name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-key
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Refuse to start without configuration
        run: |
          if env -u DJANGO_SECRET_KEY python manage.py check; then
            echo "settings must fail closed when no secret key is configured" >&2
            exit 1
          fi

      - name: System check and pending-migration check
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test

      - name: No build artifacts, databases or scaffold keys are tracked
        run: |
          if git ls-files | grep -E '(__pycache__/|\.pyc$|\.sqlite3$)'; then exit 1; fi
          if git grep -n "django-insecure-" -- . ':!todos/tests.py' ':!.github'; then exit 1; fi
